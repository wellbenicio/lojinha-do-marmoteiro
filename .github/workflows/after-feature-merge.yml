name: After feature merge

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: after-feature-merge
  cancel-in-progress: false

jobs:
  promote-and-clean-up:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FEATURE_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Open dev to main pull request
        shell: bash
        run: |
          existing_pr="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')"
          commits_ahead="$(gh api "repos/$GH_REPO/compare/main...dev" --jq '.ahead_by')"

          if [ "$commits_ahead" -eq 0 ]; then
            echo "dev has no changes to promote."
          elif [ -n "$existing_pr" ]; then
            echo "Pull request #$existing_pr from dev to main is already open."
          else
            gh pr create \
              --base main \
              --head dev \
              --title "chore: promover dev para produção" \
              --body "PR aberto automaticamente após o merge de uma feature em \`dev\`. O merge exige os checks obrigatórios e a aprovação de @wellbenicio."
          fi

      - name: Delete merged feature branch
        shell: bash
        run: gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$FEATURE_BRANCH"
